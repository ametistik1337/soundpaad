[package]
name = "soundpaad"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav", "vorbis", "flac"] }
cpal = { version = "0.18", default-features = false, features = ["pulseaudio"] }
rfd = "0.17"
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.22"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
evdev = "0.13.2"
urlencoding = "2"
crossbeam-channel = "0.5"
